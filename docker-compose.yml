version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: saarthi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saarthi_db}
      POSTGRES_USER: ${POSTGRES_USER:-saarthi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saarthi_dev_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saarthi} -d ${POSTGRES_DB:-saarthi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
